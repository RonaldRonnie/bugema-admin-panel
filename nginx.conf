# Nginx config for the admin console container.
#
# Two jobs: serve the static files, and (optionally) reverse-proxy /api/ to the
# API so the console and the API share an origin. Sharing an origin is the
# simplest deployment: no CORS to configure, and no cross-site cookie rules to
# reason about. Set apiBaseUrl to '/api/v1' in config.js when you use it.

server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # config.js carries the API URL and must never be cached, or a redeploy
    # that changes it would be ignored by browsers still holding the old copy.
    location = /config.js {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    # Everything else is content-addressed by deploy, so a short cache is fine.
    location / {
        add_header Cache-Control "public, max-age=300";
        try_files $uri $uri/ /index.html;
    }

    # Uncomment to serve the API from this same origin. API_UPSTREAM is the
    # API container's host:port, e.g. app:3000 under the project's compose file.
    #
    # location /api/ {
    #     proxy_pass         http://app:3000;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Host              $host;
    #     proxy_set_header   X-Real-IP         $remote_addr;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $scheme;
    #     # The API's WebSocket gateway (messaging) needs these two.
    #     proxy_set_header   Upgrade           $http_upgrade;
    #     proxy_set_header   Connection        "upgrade";
    # }

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   512;

    # The console talks to one API origin and loads nothing from anywhere else.
    add_header X-Content-Type-Options "nosniff"    always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "no-referrer" always;
}
